<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Store</title>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>

    <header class="header">
      <h1>My Store</h1>

      <button id="themeToggleBtn" class="theme-btn">
        Toggle Theme
      </button>
    </header>

    <section class="products">

      <div class="product-card">
        <h2>Headphone</h2>
        <p>$120</p>

        <button
          class="add-to-cart"
          data-id="1"
          data-name="Headphone"
          data-price="120">

          Add to Cart
        </button>
      </div>

      <div class="product-card">
        <h2>Keyboard</h2>
        <p>$80</p>

        <button
          class="add-to-cart"
          data-id="2"
          data-name="Keyboard"
          data-price="80">

          Add to Cart
        </button>
      </div>

      <div class="product-card">
        <h2>Mouse</h2>
        <p>$50</p>

        <button
          class="add-to-cart"
          data-id="3"
          data-name="Mouse"
          data-price="50">

          Add to Cart
        </button>
      </div>

    </section>

    <section class="cart-section">

      <h2>Shopping Cart</h2>

      <div id="cartItemsContainer"></div>

      <div class="cart-total">
        <p>Subtotal: <span id="subtotal">$0.00</span></p>
        <p>Tax (10%): <span id="tax">$0.00</span></p>
        <h3>Total: <span id="total">$0.00</span></h3>
      </div>

    </section>

    <script src="script.js"></script>

  </body>
</html>
