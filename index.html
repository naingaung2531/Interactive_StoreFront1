<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Storefront</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>My Tech Store</h1>
      <button id="theme-toggle">Toggle Theme</button>
    </header>

    <main>
      <section class="products">
        <h2>Products</h2>
        <div class="product-grid">
          <div class="product-card">
            <h3>Wireless Mouse</h3>
            <p>$29.99</p>
            <button class="add-to-cart-btn" data-id="1"
              data-name="Wireless Mouse" data-price="29.99">Add to Cart</button>
          </div>
          <div class="product-card">
            <h3>Mechanical Keyboard</h3>
            <p>$89.99</p>
            <button class="add-to-cart-btn" data-id="2"
              data-name="Mechanical Keyboard" data-price="89.99">Add to
              Cart</button>
          </div>
          <div class="product-card">
            <h3>USB-C Cable 2m</h3>
            <p>$12.50</p>
            <button class="add-to-cart-btn" data-id="3"
              data-name="USB-C Cable 2m" data-price="12.50">Add to Cart</button>
          </div>
          <div class="product-card">
            <h3>External Monitor</h3>
            <p>$199.00</p>
            <button class="add-to-cart-btn" data-id="4"
              data-name="External Monitor" data-price="199.00">Add to
              Cart</button>
          </div>
        </div>
      </section>

      <section class="cart">
        <h2>Shopping Cart</h2>
        <div id="cart-container">
          <!-- Cart items will be rendered here by JS -->
          <!-- Sample item for style reference -->
          <div class="cart-item">
            <div class="cart-item-details">
              <span class="cart-item-title">Wireless Mouse</span>
              <span>$29.99</span>
            </div>
            <button class="remove-btn" data-id="1">Remove</button>
          </div>
          <!-- <p class="empty-msg">Your cart is empty.</p> -->
        </div>
        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Tax (10%):</span>
            <span id="tax">$0.00</span>
          </div>
          <div class="summary-row grand-total">
            <span>Grand Total:</span>
            <span id="grand-total">$0.00</span>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
